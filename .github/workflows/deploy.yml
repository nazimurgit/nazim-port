name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # This tells GitHub to build every time you save to 'main'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install # Installs React, Tailwind, and Motion

      - name: Build project
        run: npm run build # Creates the final website files

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite puts the finished site in the 'dist' folder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
